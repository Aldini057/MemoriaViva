services:
  memoriaviva:
    build: .
    container_name: memoriaviva_rise
    ports:
      - "8501:8501"
      - "8765:8765"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PTT_BIND_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
