<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MemoriaViva RISE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0F1419;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #171E26;
      border: 1px solid #26313E;
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
    }
    .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #12323D;
      color: #67E8F9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.92rem; line-height: 1.5; color: #94A3B8; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #22B8CF;
      color: #082026;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .hint {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
    </div>
    <h1>MemoriaViva RISE</h1>
    <p>No se pudo conectar con el servidor en este momento. Verifica tu conexión a internet o que la URL del servidor HTTPS esté configurada.</p>
    <button onclick="window.location.reload()">Reintentar conexión</button>
    <div class="hint">Configura la variable APP_SERVER_URL en GitHub Actions antes de compilar el APK.</div>
  </div>
</body>
</html>
